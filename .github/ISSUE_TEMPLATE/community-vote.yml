name: Vote for an experiment
description: Submit a public, reviewed vote for an experiment worth learning from.
title: "vote: "
labels: [community-vote]
body:
  - type: markdown
    attributes:
      value: |
        A vote means this experiment is useful to learn from, not that its outcome is proven.
        Your ballot and GitHub identity are public. Do not include private information.
        Votes count after independent review and a signed receipt is merged. Accounts must
        have been at least 90 days old when submitting; each account has five active choices,
        with one vote per experiment. Closing this issue requests withdrawal at the next sync.
        Edited ballots require new review. No payment or popularity purchase is allowed.
  - type: input
    id: idea
    attributes:
      label: Idea ID
      description: The canonical slug from the experiment's URL.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this deserves a vote
      description: In at least 80 characters, name a specific lesson, result or open question and explain why it is useful. Evidence links are welcome; no private details.
    validations:
      required: true
  - type: checkboxes
    id: declaration
    attributes:
      label: Declaration
      options:
        - label: I read the experiment, am not submitting for payment, and am not using another account to multiply my votes.
          required: true
